<!DOCTYPE html>
{{- /* Mirror of layouts/_default/baseof.html — see the note there. */ -}}
<html lang="{{ site.Language.Lang | default "en" }}">
<head>
{{ partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}">
  {{- if .IsPage }}
  <div class="read-progress" aria-hidden="true"></div>
  {{- end }}
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
