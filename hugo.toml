# ─────────────────────────────────────────────────────────────────────────────
# Site configuration
#
# hugo.toml is the ONLY config Hugo reads. The config.toml that used to sit
# next to it was ignored completely (Hugo prefers hugo.toml), so its settings —
# `[languages.en] contentDir = 'content/en'`, reading_speed, hardWraps, favicon
# — never applied. Everything worth keeping has been folded in here.
# ─────────────────────────────────────────────────────────────────────────────

baseURL = 'https://thevoidis.github.io/'
locale = 'en-us'
title = 'thevoidis'

# Deliberately no [languages.*] block: the content is not split by language, and
# a stray contentDir pointing at a non-existent folder hides every page.

[taxonomies]
  tag = 'tags'
  category = 'categories'

# Comic reader manifests. Comic pages declare this format alongside HTML, so
# Hugo writes /comics/<dir>/manifest.json itself, filling in the `pages` array
# from the images actually on disk (see layouts/comics/comic.manifest.json and
# partials/lib/comic-pages.html). The small comic.json next to the images is
# the editable source of title/author/description/cover; there is no page list
# to keep in sync.
[outputFormats.Manifest]
  mediaType   = 'application/json'
  baseName    = 'manifest'
  isPlainText = true
  isHTML      = false

[params]
  # Comic reader. The viewer app is its own repository
  # (github.com/Thevoidis/Thevoidis-Comic-Viewer), deployed as a GitHub Pages
  # project site. Nothing is vendored in this repo — the comic pages iframe this
  # URL and hand it a comic directory in `?comic=`. One place to bump when the
  # viewer is rebuilt; see layouts/partials/lib/viewer-url.html.
  viewerURL   = 'https://thevoidis.github.io/Thevoidis-Comic-Viewer/'
  tagline     = 'stories, songs & slow thoughts'
  description = 'A personal library — essays, short stories, AI-made songs and web novels, all released into the public domain.'
  author      = 'thevoidis'
  logo        = '/favicon.png'
  license     = 'CC0 1.0 Universal'
  licenseURL  = 'https://creativecommons.org/publicdomain/zero/1.0/'
  repo        = 'https://github.com/thevoidis/thevoidis.github.io'
  intro       = "This is where I keep everything I make: the things I think about, the things I make up, and the things I record. No trackers, no comments, no accounts."

[markup]
  [markup.goldmark.renderer]
    # hardWraps is kept OFF to match today's live rendering: turning it on
    # re-flows every existing essay (single newlines become <br>).
    hardWraps = false

[related]
  threshold = 20
  includeNewer = true
  [[related.indices]]
    name = 'tags'
    weight = 100
